<style>
  :root{
    --bg:#0b0d0a; --panel:#12140f; --panel-2:#161a13;
    --gold:#c9a227; --gold-soft:#e8c874; --green:#1f4d3a;
    --ink:#f1ecdf; --muted:#8b9088; --line:rgba(201,162,39,0.22);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif; font-weight:300;}
  h1,h2{font-family:'Fraunces', serif; font-weight:400;}
  a{color:inherit; text-decoration:none;}
  .eyebrow{font-family:'Space Mono', monospace; font-size:0.7rem; letter-spacing:0.28em; text-transform:uppercase; color:var(--gold);}

  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; justify-content:space-between; align-items:center;
    padding:22px 40px; backdrop-filter:blur(10px);
    background:linear-gradient(to bottom, rgba(11,13,10,0.9), rgba(11,13,10,0.6));
    border-bottom:1px solid var(--line);
  }
  .logo{font-family:'Fraunces', serif; font-size:1.15rem; letter-spacing:0.08em;}
  .logo em{color:var(--gold); font-style:normal;}

  .page-hero{padding:170px 40px 60px; text-align:center; border-bottom:1px solid var(--line);}
  .page-hero h1{font-size:clamp(2rem,4.5vw,2.8rem); margin-top:16px;}
  .page-hero p{color:var(--muted); max-width:52ch; margin:16px auto 0; font-size:0.95rem; line-height:1.7;}

  .wrap{max-width:820px; margin:0 auto; padding:80px 40px 100px;}
  .back-link{
    display:inline-flex; align-items:center; gap:8px; margin-bottom:50px;
    font-family:'Space Mono', monospace; font-size:0.75rem; color:var(--muted); transition:color 0.25s;
  }
  .back-link:hover{color:var(--gold-soft);}

  .cgv-item{border-bottom:1px solid var(--line); padding:34px 0;}
  .cgv-item:first-child{padding-top:0;}
  .cgv-num{
    font-family:'Space Mono', monospace; font-size:0.68rem; letter-spacing:0.15em;
    color:var(--gold); text-transform:uppercase; margin-bottom:10px; display:block;
  }
  .cgv-item h2{font-size:1.25rem; margin-bottom:14px; color:var(--gold-soft);}
  .cgv-item p{color:var(--muted); line-height:1.85; font-size:0.94rem; margin-bottom:10px;}
  .cgv-item p:last-child{margin-bottom:0;}
  .cgv-item strong{color:var(--ink); font-weight:500;}

  footer{padding:60px 40px 40px; text-align:center; border-top:1px solid var(--line);}
  footer p{color:var(--muted); font-size:0.82rem; margin-bottom:6px;}

  @media (max-width:700px){
    header{padding:18px 22px;}
    .page-hero{padding:130px 22px 50px;}
    .wrap{padding:60px 22px 70px;}
  }
</style>
</head>
<body>

<header>
  <a href="/" class="logo">VR <em>BODY ART</em></a>
</header>

<section class="page-hero" style="min-height:70vh; display:flex; flex-direction:column; justify-content:center; padding-top:120px;">
  <div class="eyebrow">Erreur 404</div>
  <h1>Cette page n'existe pas</h1>
  <p>Le lien que vous avez suivi est peut-être incorrect, ou la page a été déplacée. Retournez à l'accueil pour continuer votre navigation.</p>
  <div style="margin-top:36px; display:flex; gap:16px; justify-content:center; flex-wrap:wrap;">
    <a href="/" class="btn btn-primary">Retour à l'accueil</a>
    <a href="/portfolio" class="btn btn-ghost">Voir le portfolio</a>
  </div>
</section>

<footer>
  <p>© VR Body Art — 12 rue Duguey du Fay, 60600 Clermont</p>
  <p>vraimbaud23@gmail.com</p>
</footer>
